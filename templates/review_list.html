{% extends "base.html" %}

{% block content %}

<h1>Reviews</h1>

<ul>
    {% for review in reviews %}
        <li>
            {{ review.body }}<br>
            Book: {{ review.book.title }}<br>
            Publisher: {{ review.book.publisher.name }}
        </li>
        <br>
    {% endfor %}
</ul>

{% endblock %}
